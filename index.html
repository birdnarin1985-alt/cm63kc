<!DOCTYPE html>
<html lang="th" class="h-full w-full overflow-hidden m-0 p-0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum OS - Pure Boxel Canvas Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
        
        /* ZERO DOM / ZERO REFLOW / NATIVE APP LOCK */
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            background-color: #121A12;
            font-family: 'Sarabun', sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            user-select: none;
        }

        #quantum-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #F4F3EF;
            cursor: crosshair;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden m-0 p-0">

    <!-- PURE CANVAS: ไม่มี DOM ข้างใน เรนเดอร์ทุกอย่างด้วย Boxel Particle Matrix -->
    <canvas id="quantum-canvas"></canvas>

    <script>
        const canvas = document.getElementById('quantum-canvas');
        const ctx = canvas.getContext('2d');

        // ปรับขนาด Canvas ให้เต็มจอแบบคมชัดระดับ Retina (High DPI)
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ระบบจัดการสถานะควอนตัม (Quantum State)
        const state = {
            apiKey: localStorage.getItem('quantum_api_key') || '',
            tokens: 'Ready',
            heartPhase: 0,
            particles: [],
            chatHistory: [
                { role: 'AI', text: 'เจริญพร/สวัสดีครับช่างเบิร์ด! Pure Boxel Canvas Engine พร้อมปฏิบัติการ (Zero DOM)' },
                { role: 'AI', text: 'ทุกอณูตัวอักษรและอินเทอร์เฟซถูกเรนเดอร์ด้วยอนุภาคบ็อกซ์เซลผ่าน JavaScript ล้วนๆ' }
            ],
            inputText: '',
            isListening: false
        };

        // สร้างอนุภาคบ็อกซ์เซลเริ่มต้น (Boxel Particle Field)
        function initParticles() {
            state.particles = [];
            for(let i = 0; i < 150; i++) {
                state.particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    size: Math.random() * 3 + 2,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }
        initParticles();

        // เสียงกระดิ่งควอนตัม (Quantum Chime)
        function playChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [261.63, 293.66, 329.63, 349.23, 392.00];
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.3);
                    }, index * 90);
                });
            } catch(e) {}
        }

        // เมนหลักการเรนเดอร์ (Pure Canvas Rendering Loop - On-Demand & Event Driven)
        function render() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 1. เคลียร์จอและวาดพื้นหลัง E-Paper Paper Texture
            ctx.fillStyle = '#F4F3EF';
            ctx.fillRect(0, 0, width, height);

            // 2. เรนเดอร์อนุภาคบ็อกซ์เซลลอยตัว (Boxel Particle Background)
            state.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if(p.x < 0) p.x = width;
                if(p.x > width) p.x = 0;
                if(p.y < 0) p.y = height;
                if(p.y > height) p.y = 0;

                ctx.fillStyle = `rgba(35, 78, 36, ${p.alpha})`;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
            });

            // 3. เรนเดอร์แถบหัวกระดาษ (Header HUD)
            ctx.fillStyle = '#FCFCFA';
            ctx.fillRect(0, 0, width, 55);
            ctx.strokeStyle = '#D5DDD5';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, width, 55);

            // ไอคอนรถไถและชื่อโปรเจกต์
            ctx.fillStyle = '#234E24';
            ctx.beginPath();
            ctx.arc(30, 27, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('🚜', 22, 31);

            ctx.fillStyle = '#234E24';
            ctx.font = 'bold 14px Sarabun, sans-serif';
            ctx.fillText('Chiangmai 63 - Quantum OS (Pure Boxel Engine)', 56, 32);

            // 4. เรนเดอร์ Quantum LED Terminal & Breathing Heart (มุมซ้ายบน / แถบซ้าย)
            const sidebarWidth = Math.min(320, width * 0.35);
            ctx.fillStyle = '#FCFCFA';
            ctx.fillRect(15, 65, sidebarWidth - 20, height - 140);
            ctx.strokeRect(15, 65, sidebarWidth - 20, height - 140);

            // หัวข้อ LED HUD
            ctx.fillStyle = '#234E24';
            ctx.font = 'bold 12px Sarabun, sans-serif';
            ctx.fillText('🟢 Quantum LED Terminal', 28, 92);

            // ดวงไฟชีพจรหัวใจ (Breathing Heart Animation)
            state.heartPhase += 0.04;
            const heartScale = 1 + Math.sin(state.heartPhase) * 0.2;
            ctx.save();
            ctx.translate(sidebarWidth - 35, 88);
            ctx.scale(heartScale, heartScale);
            ctx.fillStyle = '#234E24';
            ctx.font = '14px sans-serif';
            ctx.fillText('💚', -10, 5);
            ctx.restore();

            // ช่อง LED API Key Box
            ctx.fillStyle = '#121A12';
            ctx.fillRect(25, 110, sidebarWidth - 40, 36);
            ctx.strokeStyle = '#234E24';
            ctx.strokeRect(25, 110, sidebarWidth - 40, 36);

            ctx.fillStyle = '#7EE787';
            ctx.font = '11px monospace';
            const maskedKey = state.apiKey ? '••••••••••••••••••••' : 'คลิกเพื่อป้อน Gemini API Key...';
            ctx.fillText('KEY: ' + maskedKey, 35, 133);

            // รายการโหนดโครงการ (Project Nodes)
            ctx.fillStyle = '#2C3E2D';
            ctx.font = '12px Sarabun, sans-serif';
            ctx.fillText('🌱 โครงการโคกหนองนา (Active)', 28, 175);
            ctx.fillStyle = '#666666';
            ctx.fillText('📐 งานสำรวจ LiDAR & BOQ', 28, 205);
            ctx.fillText('🏡 งานตกแต่งภายใน 3D', 28, 235);
            ctx.fillText('💰 บัญชีภาษี & ใบวางบิล', 28, 265);

            // สถานะ Pointer Points
            ctx.fillStyle = '#234E24';
            ctx.font = 'bold 11px Sarabun, sans-serif';
            ctx.fillText('Pointer Points: 1,240 pts', 28, height - 105);
            ctx.fillStyle = '#2E7D32';
            ctx.fillText('Efficiency: 99.2% Saved', 28, height - 85);

            // 5. เรนเดอร์พื้นที่สนทนาหลัก (Main Chat Area - Boxel Typography)
            const chatX = sidebarWidth + 25;
            const chatWidth = width - chatX - 20;
            const chatHeight = height - 140;

            ctx.fillStyle = '#FCFCFA';
            ctx.fillRect(chatX, 65, chatWidth, chatHeight);
            ctx.strokeRect(chatX, 65, chatWidth, chatHeight);

            // วาดข้อความแชททีละโหนดบ็อกซ์เซล
            let currentY = 95;
            state.chatHistory.forEach((msg) => {
                const isUser = msg.role === 'User';
                ctx.fillStyle = isUser ? '#234E24' : '#E8F0E8';
                
                // คำนวณความกว้างกล่องข้อความ
                const boxWidth = Math.min(chatWidth - 40, 500);
                const boxX = isUser ? (chatX + chatWidth - boxWidth - 20) : (chatX + 20);

                ctx.fillRect(boxX, currentY, boxWidth, 50);
                ctx.strokeStyle = '#D5DDD5';
                ctx.strokeRect(boxX, currentY, boxWidth, 50);

                ctx.fillStyle = isUser ? '#FFFFFF' : '#2C3E2D';
                ctx.font = '12px Sarabun, sans-serif';
                ctx.fillText(msg.text.substring(0, 65), boxX + 12, currentY + 30);

                currentY += 65;
            });

            // 6. เรนเดอร์แถบเครื่องมือพิมพ์ข้อความด้านล่าง (Bottom Toolbar HUD)
            const toolbarY = height - 65;
            ctx.fillStyle = '#FCFCFA';
            ctx.fillRect(chatX, toolbarY, chatWidth, 50);
            ctx.strokeRect(chatX, toolbarY, chatWidth, 50);

            // ปุ่ม ＋
            ctx.fillStyle = '#234E24';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('＋', chatX + 15, toolbarY + 31);

            // ช่องพิมพ์ข้อความจำลอง
            ctx.fillStyle = '#2C3E2D';
            ctx.font = '12px Sarabun, sans-serif';
            ctx.fillText(state.inputText || 'พิมพ์ข้อความคุยกับน้องรถไถน้อย หรือคลิกวาง Key...', chatX + 50, toolbarY + 31);

            // ปุ่มไมค์ 🎤 และ ปุ่มส่ง
            ctx.fillText('🎤', chatX + chatWidth - 75, toolbarY + 31);
            ctx.fillStyle = '#234E24';
            ctx.fillRect(chatX + chatWidth - 55, toolbarY + 10, 45, 30);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('ส่ง', chatX + chatWidth - 42, toolbarY + 30);

            // วนลูปเรนเดอร์แบบเบาสลิว (Lightweight RequestAnimationFrame สำหรับชีพจรและอนุภาค)
            requestAnimationFrame(render);
        }

        // เริ่มต้นการเรนเดอร์
        render();

        // ระบบรับคลิกและอินพุตแบบสมบูรณ์ผ่าน Canvas Event Listeners
        window.addEventListener('click', (e) => {
            const sidebarWidth = Math.min(320, window.innerWidth * 0.35);
            
            // คลิกที่กล่อง LED API Key เพื่อกรอกรหัส
            if(e.clientX >= 25 && e.clientX <= sidebarWidth - 15 && e.clientY >= 110 && e.clientY <= 146) {
                const newKey = prompt('กรุณาวาง Google Gemini API Key ของช่างเบิร์ด:', state.apiKey);
                if(newKey !== null) {
                    state.apiKey = newKey.trim();
                    localStorage.setItem('quantum_api_key', state.apiKey);
                    state.tokens = 'Active';
                    playChime();
                }
            }
        });

        // รองรับการพิมพ์ข้อความผ่านคีย์บอร์ด
        window.addEventListener('keydown', async (e) => {
            if(e.key === 'Enter') {
                if(!state.inputText.trim()) return;
                const userMsg = state.inputText;
                state.chatHistory.push({ role: 'User', text: userMsg });
                state.inputText = '';
                playChime();

                if(!state.apiKey) {
                    state.chatHistory.push({ role: 'AI', text: 'กรุณาคลิกที่ LED Terminal มุมซ้ายเพื่อใส่ API Key ก่อนครับช่างเบิร์ด!' });
                    return;
                }

                // เรียกใช้งาน Gemini API จริง
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "คุณคือ Quantum OS AI ผู้ช่วยภาคสนามโครงการเชียงใหม่ 63 สไตล์สุภาพ ไพเราะ และกระชับ: " + userMsg }] }]
                        })
                    });
                    const data = await response.json();
                    let aiReply = "รับทราบครับช่างเบิร์ด ประมวลผลเรียบร้อย!";
                    if(data.candidates && data.candidates[0].content.parts[0].text) {
                        aiReply = data.candidates[0].content.parts[0].text;
                    }
                    state.chatHistory.push({ role: 'AI', text: aiReply });
                    
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance("ประมวลผลเรียบร้อย");
                        utterance.lang = 'th-TH';
                        utterance.rate = 1.3;
                        window.speechSynthesis.speak(utterance);
                    }
                } catch(err) {
                    state.chatHistory.push({ role: 'AI', text: 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message });
                }
            } else if(e.key === 'Backspace') {
                state.inputText = state.inputText.slice(0, -1);
            } else if(e.key.length === 1) {
                state.inputText += e.key;
            }
        });
    </script>
</body>
</html>
