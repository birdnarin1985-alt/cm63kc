<!DOCTYPE html>
<html lang="th" style="width: 100vw; height: 100dvh; margin: 0; padding: 0; overflow: hidden; background: #121A12; touch-action: none; user-select: none; -webkit-user-select: none;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum OS - Zero DOM Boxel Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap');
    </style>
</head>
<body style="width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;">

    <!-- THE PURE CANVAS CORE: ไร้ซึ่ง DOM ภายใน 100% -->
    <canvas id="quantum-core" style="display: block; width: 100%; height: 100%;"></canvas>

    <script>
        const canvas = document.getElementById('quantum-core');
        const ctx = canvas.getContext('2d');

        // สถาปัตยกรรม State & Blueprint (Green Team)
        const OS = {
            width: 0, height: 0,
            dpr: window.devicePixelRatio || 1,
            apiKey: localStorage.getItem('quantum_key') || '',
            inputText: '',
            chat: [
                { role: 'AI', msg: 'เจริญพรครับช่างเบิร์ด! ระบบ Pure Boxel Canvas ทำงานสมบูรณ์' },
                { role: 'AI', msg: '[วิชา]: ไร้ DOM ภายใน นิ่งสนิท 100% สัมปติฉามิ' }
            ],
            heartBeat: 0,
            lastRender: 0,
            colors: {
                bg: '#F4F3EF', paper: '#FCFCFA', border: '#D5DDD5',
                greenCore: '#234E24', ledBg: '#121A12', ledText: '#7EE787'
            }
        };

        function resize() {
            OS.width = window.innerWidth;
            OS.height = window.innerHeight;
            canvas.width = OS.width * OS.dpr;
            canvas.height = OS.height * OS.dpr;
            ctx.scale(OS.dpr, OS.dpr);
            drawBoxels(performance.now());
        }
        window.addEventListener('resize', resize);

        // เครื่องยนต์วาดอนุภาคบ็อกซ์เซล (Boxel Engine Render Loop)
        function drawBoxels(timestamp) {
            // ควบคุม Refresh Rate ให้เมตตาต่อระบบ (ประมาณ 30fps สำหรับดวงไฟหัวใจ)
            if (timestamp - OS.lastRender < 33) {
                requestAnimationFrame(drawBoxels);
                return;
            }
            OS.lastRender = timestamp;

            // 1. เคลียร์ผืนผ้าใบ (Base E-Paper)
            ctx.fillStyle = OS.colors.bg;
            ctx.fillRect(0, 0, OS.width, OS.height);

            const sidebarW = Math.min(280, OS.width * 0.35);
            const isMobile = OS.width < 768;
            const uiWidth = isMobile ? OS.width : sidebarW;

            // 2. เรนเดอร์ Sidebar (หรือ Top Bar บนมือถือ)
            ctx.fillStyle = OS.colors.paper;
            ctx.fillRect(0, 0, uiWidth, OS.height);
            ctx.strokeStyle = OS.colors.border;
            ctx.beginPath();
            ctx.moveTo(uiWidth, 0); ctx.lineTo(uiWidth, OS.height);
            ctx.stroke();

            // โลโก้โครงการ
            ctx.fillStyle = OS.colors.greenCore;
            ctx.font = 'bold 16px Sarabun';
            ctx.fillText('🚜 Chiangmai 63', 15, 30);
            ctx.beginPath(); ctx.moveTo(0, 45); ctx.lineTo(uiWidth, 45); ctx.stroke();

            // Quantum LED Terminal & Breathing Heart
            ctx.fillStyle = OS.colors.bg;
            ctx.fillRect(0, 46, uiWidth, 80);
            ctx.beginPath(); ctx.moveTo(0, 126); ctx.lineTo(uiWidth, 126); ctx.stroke();

            // คำนวณชีพจรหัวใจ (Sine Wave)
            OS.heartBeat += 0.05;
            const scale = 1 + Math.sin(OS.heartBeat) * 0.15;
            ctx.save();
            ctx.translate(25, 65);
            ctx.scale(scale, scale);
            ctx.fillStyle = OS.colors.greenCore;
            ctx.font = '14px Arial';
            ctx.fillText('💚', -10, 5);
            ctx.restore();

            ctx.fillStyle = OS.colors.greenCore;
            ctx.font = 'bold 12px Sarabun';
            ctx.fillText('Quantum LED HUD', 45, 69);

            // LED Input Box
            ctx.fillStyle = OS.colors.ledBg;
            ctx.fillRect(15, 85, uiWidth - 30, 30);
            ctx.fillStyle = OS.colors.ledText;
            ctx.font = '11px monospace';
            const keyDisp = OS.apiKey ? '••••••••••••••••' : '[ คลิกเพื่อใส่ API Key ]';
            ctx.fillText('KEY: ' + keyDisp, 25, 105);

            // 3. เรนเดอร์พื้นที่แชทหลัก
            const chatX = isMobile ? 0 : uiWidth;
            const chatW = isMobile ? OS.width : OS.width - uiWidth;
            const chatH = OS.height - 60; // เว้นที่ให้ Input ด้านล่าง

            if (!isMobile) {
                // Header Chat
                ctx.fillStyle = OS.colors.paper;
                ctx.fillRect(chatX, 0, chatW, 45);
                ctx.beginPath(); ctx.moveTo(chatX, 45); ctx.lineTo(OS.width, 45); ctx.stroke();
                ctx.fillStyle = OS.colors.greenCore;
                ctx.font = 'bold 14px Sarabun';
                ctx.fillText('John Deere Mini AI (Zero DOM)', chatX + 20, 28);
            }

            // เรนเดอร์โหนดข้อความ
            let startY = (isMobile ? 140 : 65);
            for (let i = 0; i < OS.chat.length; i++) {
                const node = OS.chat[i];
                const isUser = node.role === 'User';
                ctx.font = '14px Sarabun';
                const textWidth = ctx.measureText(node.msg).width;
                const boxW = Math.min(textWidth + 30, chatW - 40);
                const boxX = isUser ? chatX + chatW - boxW - 15 : chatX + 15;

                ctx.fillStyle = isUser ? OS.colors.greenCore : OS.colors.paper;
                // วาดกล่อง Boxel 3D
                ctx.fillRect(boxX, startY, boxW, 40);
                ctx.strokeStyle = isUser ? '#1B3A1C' : OS.colors.border;
                ctx.strokeRect(boxX, startY, boxW, 40);

                ctx.fillStyle = isUser ? '#FFF' : '#2C3E2D';
                ctx.fillText(node.msg, boxX + 15, startY + 25);
                startY += 55;
            }

            // 4. เรนเดอร์กล่อง Input ด้านล่าง
            const inputY = OS.height - 50;
            ctx.fillStyle = OS.colors.paper;
            ctx.fillRect(chatX, inputY, chatW, 50);
            ctx.beginPath(); ctx.moveTo(chatX, inputY); ctx.lineTo(OS.width, inputY); ctx.stroke();

            ctx.fillStyle = OS.colors.bg;
            ctx.fillRect(chatX + 15, inputY + 10, chatW - 90, 30);
            ctx.fillStyle = '#2C3E2D';
            ctx.font = '14px Sarabun';
            
            // แสดงเคอร์เซอร์กะพริบ
            const cursor = (Math.floor(performance.now() / 500) % 2 === 0) ? '|' : '';
            ctx.fillText((OS.inputText || 'พิมพ์ข้อความ...') + cursor, chatX + 25, inputY + 30);

            // ปุ่มส่ง
            ctx.fillStyle = OS.colors.greenCore;
            ctx.fillRect(chatX + chatW - 65, inputY + 10, 50, 30);
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 12px Sarabun';
            ctx.fillText('ส่ง', chatX + chatW - 50, inputY + 29);

            requestAnimationFrame(drawBoxels);
        }

        // ระบบรับผัสสะ (Events) แบบ Zero DOM
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (!OS.inputText.trim()) return;
                OS.chat.push({ role: 'User', msg: OS.inputText });
                OS.inputText = '';
                
                // จำลองการตอบกลับของ AI Blueprint
                setTimeout(() => {
                    OS.chat.push({ role: 'AI', msg: 'รับทราบครับ ประมวลผลผ่าน Boxel เรียบร้อย!' });
                }, 600);
            } else if (e.key === 'Backspace') {
                OS.inputText = OS.inputText.slice(0, -1);
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                OS.inputText += e.key;
            }
        });

        // ตรวจจับการคลิกบน Canvas (เทียบพิกัดแกน X, Y)
        canvas.addEventListener('pointerdown', (e) => {
            const isMobile = OS.width < 768;
            const sidebarW = Math.min(280, OS.width * 0.35);
            const uiWidth = isMobile ? OS.width : sidebarW;
            
            // ตรวจจับคลิกที่กล่อง LED API Key
            if (e.clientX >= 15 && e.clientX <= uiWidth - 15 && e.clientY >= 85 && e.clientY <= 115) {
                const key = prompt('กรุณาวาง Gemini API Key (ทำงานนอก DOM):', OS.apiKey);
                if (key !== null) {
                    OS.apiKey = key.trim();
                    localStorage.setItem('quantum_key', OS.apiKey);
                }
            }
        });

        resize();
        requestAnimationFrame(drawBoxels);
    </script>
</body>
</html>
